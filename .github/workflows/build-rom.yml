name: Build LineageOS 17.1 (Android 10)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Space
        uses: rokibhasansagar/slimhub_actions@main
      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev lz4 python2 zip unzip curl git
      - name: Sync LineageOS 17.1
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@local"
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          mkdir workspace && cd workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          ~/bin/repo sync -c --no-tags --optimized-fetch --force-sync -j$(nproc)
          rm -rf .repo
          df -h /
      - name: Inject Device Tree
        run: |
          cd workspace
          git clone https://github.com/Faisalahame/lineage-a2corelte.git device/samsung/a2corelte
      - name: Build Images
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C WITH_DEXPREOPT=false
          lunch lineage_a2corelte-userdebug
          mka systemimage bootimage -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Release Images
        if: hashFiles('workspace/out/target/product/a2corelte/system.img') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imgs-${{ github.run_id }}
          files: |
            workspace/out/target/product/a2corelte/system.img
            workspace/out/target/product/a2corelte/boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Images
        run: |
          ls -la workspace/out/target/product/a2corelte/system.img workspace/out/target/product/a2corelte/boot.img
