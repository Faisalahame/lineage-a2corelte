name: Build LineageOS 17.1 (Android 10)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Space
        uses: rokibhasansagar/slimhub_actions@main
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev lz4 python2 zip unzip curl git
          sudo ln -sf /usr/bin/python2 /usr/bin/python
      - name: Repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Sync LineageOS 17.1
        run: |
          mkdir -p src && cd src
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc)
      - name: Device tree
        run: |
          cd src
          git clone https://github.com/Faisalahame/lineage-a2corelte.git device/samsung/a2corelte
      - name: Product sanity check
        run: |
          cd src
          source build/envsetup.sh
          lunch lineage_a2corelte-userdebug
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
          echo "PRODUCT_PACKAGES count: $(get_build_var PRODUCT_PACKAGES | wc -w)"
      - name: Build images (no bacon)
        run: |
          cd src
          source build/envsetup.sh
          export LC_ALL=C ALLOW_MISSING_DEPENDENCIES=true WITH_DEXPREOPT=false
          lunch lineage_a2corelte-userdebug
          mka systemimage bootimage -j$(nproc) 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
      - name: Release images
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imgs-${{ github.run_id }}
          files: |
            src/out/target/product/a2corelte/boot.img
            src/out/target/product/a2corelte/system.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
