name: Build LineageOS 17.1 (Android 10)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Space
        uses: rokibhasansagar/slimhub_actions@main
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev lz4 python2 zip unzip
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo
      - name: Sync LineageOS 17.1
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)
      - name: Inject Device Tree & Prebuilt Kernel
        run: |
          cd workspace
          git clone https://github.com/Faisalahame/lineage-a2corelte.git device/samsung/a2corelte
      - name: Dump Device Tree (diagnostics)
        run: |
          cd workspace/device/samsung/a2corelte
          for f in lineage_a2corelte.mk AndroidProducts.mk device.mk BoardConfig.mk Android.mk; do
            echo "===== $f ====="; cat "$f" 2>/dev/null || echo "(missing)"
          done
      - name: Compile Android 10 ROM (full log captured)
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch lineage_a2corelte-userdebug
          echo "===== PRODUCT CONFIG ====="
          get_build_var TARGET_PRODUCT
          get_build_var PRODUCT_DEVICE
          echo "--- PRODUCT_PACKAGES count ---"
          get_build_var PRODUCT_PACKAGES | tr ' ' '\n' | wc -l
          echo "--- first 40 packages ---"
          get_build_var PRODUCT_PACKAGES | tr ' ' '\n' | head -40
          (mka bacon -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log") || echo "BUILD_FAILED_BUT_LOG_SAVED"
          echo "===== PRODUCT OUT DIR ====="
          ls -la out/target/product/a2corelte/ | head -60
          echo "===== LOG HEAD ====="
          head -80 "$GITHUB_WORKSPACE/build.log"
          echo "===== LOG TAIL ====="
          tail -120 "$GITHUB_WORKSPACE/build.log"
      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload ROM Zip to Releases
        if: hashFiles('workspace/out/target/product/a2corelte/*.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: workspace/out/target/product/a2corelte/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail Run If Build Did Not Complete
        run: |
          if ! grep -q "Package Complete" "$GITHUB_WORKSPACE/build.log"; then
            echo "::error::Build did not reach packaging. Full log uploaded as artifact."
            exit 1
          fi
