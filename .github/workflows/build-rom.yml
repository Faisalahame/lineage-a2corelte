name: Build LineageOS 17.1 (Android 10)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Space
        uses: rokibhasansagar/slimhub_actions@main
      - name: Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12
      - name: Deps + libncurses5 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev lz4 zip unzip curl git rsync
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb || true
          sudo dpkg -i libncurses5_6.2-0ubuntu2_amd64.deb || {
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5; }
          sudo apt-get install -y python2.7 || sudo ln -sf /usr/bin/python3 /usr/bin/python
      - name: Repo tool
        run: |
          mkdir -p ~/bin && curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod +x ~/bin/repo
          git config --global user.name "ci"
          git config --global user.email "ci@ci.local"
      - name: Sync LOS 17.1
        run: |
          mkdir -p src && cd src
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          ~/bin/repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc)
          rm -rf .repo
      - name: Device tree
        run: |
          cd src
          git clone --depth=1 https://github.com/Faisalahame/lineage-a2corelte.git device/samsung/a2corelte
      - name: Patch AOSP AudioPolicyManager #error
        run: |
          cd src
          # Surgically comment out the hardcoded #error in AOSP source
          sed -i 's|^#error Audio policy no longer supports legacy .conf configuration format|// #error Audio policy patched|g' frameworks/av/services/audiopolicy/managerdefault/AudioPolicyManager.cpp || true
          # Strip the macro from any Android.mk/Android.bp files just in case
          find . -name "Android.mk" -o -name "Android.bp" | xargs sed -i 's|-DUSE_LEGACY_AUDIO_POLICY||g' 2>/dev/null || true
      - name: Build images then package
        run: |
          cd src
          source build/envsetup.sh
          export LC_ALL=C ALLOW_MISSING_DEPENDENCIES=true WITH_DEXPREOPT=false
          lunch lineage_a2corelte-userdebug
          set -o pipefail
          mka systemimage bootimage -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          (mka bacon -j$(nproc) 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log") || echo "BACON_OPTIONAL_FAILED"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Release artifacts
        if: hashFiles('src/out/target/product/a2corelte/boot.img') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: |
            src/out/target/product/a2corelte/boot.img
            src/out/target/product/a2corelte/system.img
            src/out/target/product/a2corelte/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
