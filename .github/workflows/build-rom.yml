name: Build LineageOS 17.1 (Android 10)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Runner Space
        uses: rokibhasansagar/slimhub_actions@main
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev lz4 python2 zip unzip
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo
      - name: Sync LineageOS 17.1
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)
      - name: Inject Device Tree & Prebuilt Kernel
        run: |
          cd workspace
          git clone https://github.com/Faisalahame/lineage-a2corelte.git device/samsung/a2corelte
      - name: Build system + boot images
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch lineage_a2corelte-userdebug
          mka systemimage bootimage -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "===== PRODUCT OUT ====="
          ls -la out/target/product/a2corelte/ | head -40
      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload Images to Release
        if: hashFiles('workspace/out/target/product/a2corelte/system.img') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imgs-${{ github.run_id }}
          files: |
            workspace/out/target/product/a2corelte/system.img
            workspace/out/target/product/a2corelte/boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail Run If Images Missing
        run: |
          ls workspace/out/target/product/a2corelte/system.img workspace/out/target/product/a2corelte/boot.img
